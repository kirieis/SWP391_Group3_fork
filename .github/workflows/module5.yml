name: Module 5 CI - Queue Worker & Git Analytics

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/queue-worker/**"
      - ".github/workflows/module5.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "apps/queue-worker/**"
      - ".github/workflows/module5.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck, Test with Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/queue-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint check (ESLint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit & Integration Tests (Coverage >= 80%)
        run: npm run test:coverage

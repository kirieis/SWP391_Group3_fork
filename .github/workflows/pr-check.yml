name: PR Check

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  queue-worker:
    name: Queue Worker & Git Analytics (Module 5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint --workspace=@aita/queue-worker

      - name: Typecheck & Build
        run: npm run build --workspace=@aita/queue-worker

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage --workspace=@aita/queue-worker

  # Lưu ý: Khi các phân hệ khác (apps/api, apps/web, apps/sandbox-engine) hoàn thiện build & test,
  # các thành viên phụ trách có thể bổ sung thêm job kiểm tra tương ứng vào đây.

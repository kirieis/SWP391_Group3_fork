version: '3.8'

services:
  # 1. Cơ sở dữ liệu Microsoft SQL Server 2019 (MSSQL) chuẩn SRS mục 8.1
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: aita_mssql
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "AitaPassword123!" # Yêu cầu mật khẩu mạnh của MSSQL
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  # 2. Redis 7 Queue & Cache (BullMQ) chuẩn SRS mục 8.1
  redis:
    image: redis:7-alpine
    container_name: aita_redis
    restart: always
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 2.1 Queue Worker & Git Analytics (Module 5)
  queue-worker:
    build:
      context: .
      dockerfile: ./apps/queue-worker/Dockerfile
    container_name: aita_queue_worker
    restart: always
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_GATEWAY_URL=http://api:5000
      - SANDBOX_URL=http://sandbox:5001
      - GENAI_GATEWAY_URL=http://genai:5002
      - AST_ENGINE_URL=http://ast-engine:8000
      - INTERNAL_API_KEY=aita_internal_secret_key_2026
      - USE_MOCKS=true
      - NODE_ENV=production

  # 3. AST Plagiarism Detection Engine (FastAPI - Phân hệ 4)
  ast-engine:
    build:
      context: ./apps/ast-engine
    container_name: aita_ast_engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

volumes:
  mssql_data:
  redis_data:
